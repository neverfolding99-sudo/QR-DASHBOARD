<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>miterhverv</title>
<link rel="stylesheet" href="/styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/qr-code-styling@1.6.0-rc.1/lib/qr-code-styling.js"></script>
</head>
<body>
<div class="display-wrap">
  <div class="screen display-screen" id="screen">
    <div class="screen-overlay"></div>
    <div class="live-badge" id="liveBadge"><span class="live-dot"></span>LIVE</div>
    <div class="eyebrow">miterhverv.dk</div>
    <h3 id="title">Ingen aktiv session</h3>
    <div class="qr-frame" id="qrBox" style="display:none;">
      <span class="corner corner-tl"></span>
      <span class="corner corner-tr"></span>
      <span class="corner corner-bl"></span>
      <span class="corner corner-br"></span>
      <div class="qr-box"><div id="qrcode"></div></div>
    </div>
    <div class="offline-msg" id="offlineMsg" style="display:none;">
      <strong id="offlineTitle">Ingen aktiv session</strong>
      <span id="offlineBody">Kom tilbage senere</span>
    </div>
    <div class="footline" id="msg"></div>
    <div class="sync-status" id="syncStatus">Forbinder...</div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/display.js"></script>
</body>
</html>
